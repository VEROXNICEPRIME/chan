<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Prime Script // Roblox Finder Hub</title>
    <style>
        :root {
            --bg-color: #08080c;
            --panel-bg: #111118;
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --text-main: #f1f1f5;
            --text-dim: #7a7a99;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hub-card {
            background-color: var(--panel-bg);
            border: 1px solid #222233;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
        }

        h1 {
            color: var(--accent);
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #050508;
            border: 1px solid #28283d;
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00cc52, #00ff66);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 20px;
            background: #050508;
            border: 1px solid #28283d;
            border-radius: 6px;
            padding: 15px;
            display: none;
        }

        .result-title {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #020204;
            border: 1px solid #1f1f2e;
            color: #00ff66;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            resize: none;
            outline: none;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: #0088cc;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="hub-card">
        <h1>NICE PRIME SCRIPT HUB</h1>
        <div class="subtitle">ROBLOX SCRIPT FINDER & LOADER</div>

        <div class="form-group">
            <label for="game-name">Nhập tựa game Roblox:</label>
            <input type="text" id="game-name" placeholder="Ví dụ: Blox Fruits, Steal an Egg, Fish Master...">
        </div>

        <div class="form-group">
            <label for="script-query">Nhập loại Script muốn tìm:</label>
            <input type="text" id="script-query" placeholder="Ví dụ: Auto Farm, ESP, Teleport...">
        </div>

        <button class="btn" onclick="findScript()">TÌM SCRIPT NGAY</button>

        <div class="result-box" id="result-container">
            <div class="result-title" id="result-title-text">[Kết quả tìm kiếm]:</div>
            <textarea id="script-output" readonly></textarea>
            <button class="btn btn-copy" onclick="copyScript()">SAO CHÉP SCRIPT</button>
        </div>
    </div>

    <script>
        function findScript() {
            const game = document.getElementById('game-name').value.trim();
            const query = document.getElementById('script-query').value.trim();
            const resultBox = document.getElementById('result-container');
            const output = document.getElementById('script-output');
            const titleText = document.getElementById('result-title-text');

            if(!game || !query) {
                alert("Nhập đầy đủ tên game và script vào chứ boss man!");
                return;
            }

            resultBox.style.display = "block";
            titleText.innerHTML = `[Đang tìm kiếm script cho: ${game} - ${query}]`;
            output.value = "Đang kết nối cơ sở dữ liệu Luau Hub...";

            setTimeout(() => {
                const loadstringDemo = `-- Nice Prime Script Hub // Game: ${game}\n-- Chức năng: ${query}\nloadstring(game:HttpGet("https://raw.githubusercontent.com/NicePrimeHub/Roblox/main/${game.toLowerCase().replace(/\s+/g, '')}_loader.lua", true))()`;
                output.value = loadstringDemo;
                titleText.innerHTML = `[THÀNH CÔNG]: Đã tìm thấy Script tối ưu nhất cho ${game}!`;
            }, 800);
        }

        function copyScript() {
            const output = document.getElementById('script-output');
            output.select();
            output.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(output.value);
            alert("Đã sao chép script vào bộ nhớ tạm, mang vào executor mà quẩy đi boss man!");
        }
    </script>
</body>
</html>
