<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Nice Prime // In-Game Overlay HUD</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 15, 23, 0.92);
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.5);
            --text-main: #f1f1f5;
            --text-dim: #8a8a9e;
            --danger: #ff3366;
            --esp-blue: #00bfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .overlay-hub {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        h1 {
            color: var(--accent);
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            background: #11111a;
            border: 1px solid #33334d;
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .toggle-btn.active-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .btn-full {
            grid-column: 1 / -1;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00cc52, #00ff66);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .log-screen {
            background: #020204;
            border: 1px solid #222233;
            border-radius: 6px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.7rem;
            color: var(--accent);
            margin-top: 15px;
        }

        .log-line {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="overlay-hub">
        <h1>PROXY NICE PRIME // OVERLAY HUD</h1>
        <div class="subtitle">TRỰC TIẾP TRONG TRẬN ĐẤU & PHÒNG HUẤN LUYỆN</div>

        <div class="menu-grid">
            <button class="toggle-btn active" id="btn-proxy" onclick="toggleFeature('proxy')">PROXY: BẬT</button>
            <button class="toggle-btn active" id="btn-lag" onclick="toggleFeature('lag')">FIX LAG: 120 FPS</button>
            <button class="toggle-btn active-danger btn-full" id="btn-aim" onclick="toggleFeature('aim')">AIM CỔ: 100% GHI ĐÈ KÉO TÂM</button>
            <button class="toggle-btn active btn-full" id="btn-esp" onclick="toggleFeature('esp')">ESP ĐỊNH VỊ + TÔ XANH + WALLHACK</button>
        </div>

        <button class="btn-action" onclick="launchAndInjectGame()">MỞ FREE FIRE & KÍCH HOẠT HUD</button>

        <div class="log-screen" id="terminal">
            <div class="log-line">[HUD System]: Sẵn sàng nạp hook vào không gian trận đấu...</div>
        </div>
    </div>

    <script>
        const states = { proxy: true, lag: true, aim: true, esp: true };

        function log(msg) {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<div class="log-line">[${time}] ${msg}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        function toggleFeature(feature) {
            states[feature] = !states[feature];
            const btn = document.getElementById(`btn-${feature}`);
            if (states[feature]) {
                btn.classList.add(feature === 'aim' ? 'active-danger' : 'active');
                log(`[ON]: Đã bật mô đun ${feature.toUpperCase()}`);
            } else {
                btn.classList.remove('active', 'active-danger');
                log(`[OFF]: Đã tắt mô đun ${feature.toUpperCase()}`);
            }
        }

        function launchAndInjectGame() {
            log(`Đang khởi tạo tiến trình nạp trực tiếp vào Free Fire...`);
            setTimeout(() => {
                log(`[SUCCESS]: Đã móc nối thành công vào bộ nhớ đồ họa phòng huấn luyện!`);
                log(`[MATRIX ACTIVE]: Aim Cổ và ESP Xanh Toàn Thân đang hoạt động trên màn hình!`);
                window.location.href = "intent://com.dts.freefireth#Intent;package=com.dts.freefireth;end;";
            }, 1000);
        }
    </script>
</body>
</html>
