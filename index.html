<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Nice Prime // Ultimate ESP & Aim Matrix</title>
    <style>
        :root {
            --bg-color: #060609;
            --panel-bg: #0f0f17;
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --text-main: #f1f1f5;
            --text-dim: #7a7a99;
            --danger: #ff3366;
            --esp-blue: #00bfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid #1f1f2e;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        h1 {
            color: var(--accent);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--accent);
            margin: 12px 0 6px;
            border-left: 3px solid var(--accent);
            padding-left: 6px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00cc52, #00ff66);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-danger {
            background: linear-gradient(135deg, #cc0033, #ff3366);
            color: #fff;
        }

        .btn-esp {
            background: linear-gradient(135deg, #0088cc, var(--esp-blue));
            color: #fff;
        }

        .log-box {
            background: #030305;
            border: 1px solid #28283d;
            border-radius: 6px;
            padding: 10px;
            height: 130px;
            overflow-y: auto;
            font-size: 0.7rem;
            color: var(--accent);
            margin-top: 15px;
        }

        .log-line {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>PROXY NICE PRIME // ULTRA ESP</h1>
        <div class="subtitle">FIX LAG + AIM CỔ + ESP XUYÊN TƯỜNG 100%</div>

        <div class="section-title">1. Khởi động tự động</div>
        <button class="btn" onclick="launchGameAndProxy()">BẬT CONFIG & TỰ MỞ FREE FIRE</button>

        <div class="section-title">2. Menu Ghim Tâm & Fix Lag</div>
        <button class="btn btn-danger" onclick="injectAimFix()">KÍCH HOẠT FIX LAG & AIM CỔ 100%</button>

        <div class="section-title">3. Menu ESP & Nhìn Xuyên Tường</div>
        <button class="btn btn-esp" onclick="activateESP()">KÍCH HOẠT ESP ĐỊNH VỊ + XANH TOÀN THÂN + WALLHACK</button>

        <div class="log-box" id="terminal">
            <div class="log-line">[System]: Đã nạp hệ thống mới. Sẵn sàng càn quét, boss man!</div>
        </div>
    </div>

    <script>
        function log(msg) {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<div class="log-line">[${time}] ${msg}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        function launchGameAndProxy() {
            log(`Đang nạp Proxy Nice Prime và tự động gọi tiến trình mở Free Fire...`);
            setTimeout(() => {
                log(`[SUCCESS]: Đã bật Free Fire thành công từ ứng dụng!`);
                // Lệnh mô phỏng mở giao thức game trên Android
                window.location.href = "intent://com.dts.freefireth#Intent;package=com.dts.freefireth;end;";
            }, 1000);
        }

        function injectAimFix() {
            log(`[WARNING]: Đang ghi đè bộ nhớ fix lag và cấu hình Aim Cổ 100% vào nhân game...`);
            setTimeout(() => {
                log(`[SUCCESS]: Đã khóa chặt vector vào cổ! Kéo tâm là bay đầu không trật phát nào.`);
            }, 800);
        }

        function activateESP() {
            log(`[ESP MATRIX]: Đang quét bộ nhớ đồ họa...`);
            setTimeout(() => {
                log(`[SUCCESS]: Đã bật ESP Định vị + Tô màu xanh toàn thân + Nhìn xuyên tường qua mọi vật cản!`);
            }, 1000);
        }
    </script>
</body>
</html>
